# Replication of Bollerslev, Li & Tang (2026): 15-minute previous-tick midquote returns
# plus the overnight return (n = 27 per day), 25 features, HAR/SHAR/SHAR-F/SHAR-F-Exp (OLS)
# and LASSO, rolling 4-year train / 1-year validation / 1-year test, 2008-2020 test years.
name: baseline_15min
output_dir: artifacts
seed: 0

data:
  intraday: data/intraday/quotes          # tick-level NBBO midquotes (cleaned by the data team)
  daily: data/daily.parquet
  monthly: data/monthly.parquet
  market: data/market.parquet
  universe: null                          # or a file with `asset_id`; default = balanced panel
  universe_rule: balanced
  start: "2000-01-01"
  end: "2020-12-31"
  session_open: "09:30"
  session_close: "16:00"

realized:
  estimator:
    name: realized_cov
    params: {sampling: 15min}
  semicov_estimator:
    name: realized_cov
    params: {sampling: 15min}
  include_overnight: true
  annualization: 252
  n_jobs: 1

features:
  weekly_days: 5
  monthly_window: calendar
  exp_centers_of_mass: [1, 5, 21, 63]
  exp_window: 500
  factor_characteristics: [beta, size, bm, rev, nsi, cei, acc, noa, agr, inta, oscore, mom, gpf, roa, dis]
  characteristics_no_rank: [beta]
  factor_add_intercept: false
  sector_column: sector
  clip_to_unit: true

models:
  benchmark: HAR
  specs:
    - {name: HAR,        method: ols,   features: har}
    - {name: SHAR,       method: ols,   features: shar}
    - {name: SHAR-F,     method: ols,   features: shar_f}
    - {name: SHAR-F-Exp, method: ols,   features: all}
    - {name: LASSO,      method: lasso, features: all}
  train_years: 4
  val_years: 1
  first_test_year: 2008
  last_test_year: 2020
  lasso_n_alphas: 100
  lasso_alpha_min_ratio: 1.0e-4
  refit_on_train_plus_val: false
  clip_predictions: true

evaluation:
  mktcap_winsor_quantile: 0.90
  subperiods: [[2008, 2011], [2012, 2015], [2016, 2020]]

applications:
  enabled: [pairs_trading, equity_premium, risk_targeting, gmv]
  models: [HAR, LASSO]
