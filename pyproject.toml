[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "saf"
version = "0.1.0"
description = "Shared library for the SAF project: S&P 500 point-in-time intraday returns"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas>=2.2", "pyarrow"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["saf"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
