[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "corrforecast"
version = "0.1.0"
description = "Replication of Bollerslev, Li & Tang (2026) 'Forecasting and Managing Correlation Risks', with noise-robust realized covariance extensions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyarrow>=14",
    "pydantic>=2.5",
    "pyyaml>=6",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=4", "ruff>=0.4", "mypy>=1.8", "types-PyYAML"]

[project.scripts]
corrforecast = "corrforecast.pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/corrforecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: end-to-end tests that take more than a few seconds"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
